# Requirement matrix source of truth. Columns: side (world|agent|both), applies (all|lockstep|streaming),
# gate (core | core (<condition>) | profile:<name> | capability:<key> | feature:<condition>), test (assertion id,
# "<id> (warning)" for SHOULD, "manual: …", or "untestable: …"), and, on a both-sides row whose agent side is tested
# differently, agent_test (the same forms, or "<id>, else manual: …" when the suite tests it only where it can observe
