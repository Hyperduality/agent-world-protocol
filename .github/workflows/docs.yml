name: docs-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm i -g mint
      - run: mint broken-links

  schemas:
    name: schemas, examples, tagged docs, frame vectors, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Compiles every schema, validates examples/ and every ```json awp:<tag> block,
      # decodes schemas/test-vectors/frames.json, validates every wire trace in examples/v0.1/traces/,
      # then fails if any generated file (api-reference/schemas/*.mdx, generated/awp-v0.1.d.ts,
      # spec/requirements.mdx, spec/wire-traces.mdx) is stale.
      - run: npm run check
